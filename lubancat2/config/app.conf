# 方案A 应用配置（替代原 ZBasic 顶部 GLOBAL CONST）
# 格式: key = value  (支持 # 注释)
# 范围: 本项目为**控制器开发项目**；与机器人/触摸屏/称重的具体协议对接改由脚本程序实现
#       （见 docs/planA/12），故原 4321/502/称重/机器人四个服务段已从本文件移除。

# ---- 轴/单位 ----
# 本控制器为多轴系统；AXIS_COUNT 决定实际轴数(1..8)，当前项目单轴=1。
# 下面的全局运动参数写入全部轴；需要单轴覆盖时用 AXIS<n>_ 前缀，如 AXIS1_INC_PER_MM。
AXIS_COUNT      = 1             # 实际轴数(1..8)；轴 i 默认对应从站 i

# M3：定位规划方式。pp = 驱动器内部规划（默认，现场稳定）；csp = 控制器每拍下发 0x607A
# （需 EtherCAT DC 同步：ECAT_DC_ASSIGN 保持 0x0300；且脚本先 UNITS 设置脉冲当量）。
# 脚本可用 MOTION_MODE(0|1) 运行时切换；BASE 多轴 + MOVEABS 多目标为直线插补（走 CSP）。
MOTION_MODE     = pp
# INC_PER_MM    = 14043.41      # 已停用（v0.8.1）：脉冲当量不再由控制器固定/默认，
                                # 由**脚本**运行时设置：UNITS(轴号, 值)（inc/mm，按伺服+机械换算）。
                                # 未设置时定位/点动/回零/置零均明确报错（不按错比例静默执行）。
                                # 如需兼容旧现场预置：取消本行注释（脚本 UNITS 会覆盖）。
AXIS_INDEX      = 0             # 轴0 的逻辑轴号(单轴沿用 0)
MV_SPEED        = 100.0         # 数值命令默认速度 mm/s
MV_ACCEL        = 500.0         # 默认加速度 mm/s^2
MV_SPD_MAX      = 3276.7        # HMI 速度上限 mm/s
MV_TOL          = 0.05          # 到位容差 mm
MV_TIMEOUT_MS   = 10000         # 到位超时 ms

# ---- EtherCAT ----
ECAT_MASTER     = 0             # IgH 主站序号
ECAT_SLAVE_POS  = 0             # 轴0 的从站位置(第 0 个)；多轴用 ECAT_SLAVE_POS_<n>
ECAT_CYCLE_NS   = 1000000       # 周期 1ms
ECAT_DC_ASSIGN  = 0x0300        # SYNC0; 进不了 OP 时改 0x0700 或 0 试
ECAT_DC_SHIFT_NS= 500000        # SYNC0 偏移 0.5ms
ECAT_VENDOR     = 0x00100000    # 兜底：仅在读不到 SII 身份时使用（正常由总线实读覆盖）
ECAT_PRODUCT    = 0x000c0112    # 同上；IgH 要求与 SII 精确匹配
ECAT_AUTO_IDENTITY    = 1       # 1=用总线实读 vid/pid 覆盖上面的兜底值
ECAT_PROFILE          = auto    # auto=按身份自动识别；也可写档案名 sv630 / generic
ECAT_PROFILE_FORCE    = 0       # 1=身份不符也照用指定档案（只告警）
ECAT_EXPLICIT_PDO     = 1       # 1=用档案里的显式 PDO 映射（SV630 必开）
ECAT_EXPLICIT_PROFILE = 0       # 0=用档案默认档位；>0 强制该档位（sv630: 1/2/3）
ECAT_PARAM_VIA_SDO    = 1       # 6081/6083/6084 走 SDO 下发

# ---- 脚本(可选; BASIC 见 docs/planA/08, Lua 见 docs/planA/09) ----
SCRIPT_ENABLE     = 1             # 1=启动后在独立线程自动跑"开机主文件"(见下; 未设置主文件且 SCRIPT_FILE 为空则不跑)
SCRIPT_FILE       =               # 回退项: .bas / .lua 路径(可被 --script 覆盖); 语言须与 SCRIPT_ENGINE 一致
                                  # ★ 优先项: DEBUG_SCRIPT_DIR/.boot 清单指定的主文件(插件「控制器文件→设为主文件」,
                                  #   语言按扩展名); 未设主文件时才用本项; 两者都没有则不自动跑脚本
SCRIPT_ENGINE     = basic         # 自动脚本(SCRIPT_ENABLE=1)的语言: 只允许 basic(默认) | lua; 非法值启动明确报错
                                  # 调试口(DEBUG_ENABLE=1)的语言不取此值: 由 DEBUG_SCRIPT_DIR 内现有
                                  # .bas/.lua 推导(空目录=两种都收, 首次下载落盘后绑定; 见 docs/planA/13)
SCRIPT_WAIT_BUS   = 1             # 先等总线上电就绪再执行
SCRIPT_WAIT_BUS_MS= 15000         # 等总线超时
SCRIPT_TRACE      = 0             # 1=逐条打印执行语句(调试)
SCRIPT_MAX_STEPS  = 0             # 步数预算(防死循环); BASIC=语句级 / Lua=VM 指令级; **0=不限**
                                  # ★ 生产长驻脚本(EtherCAT_SocketServer.lua 端口服务)必须 0:
                                  #   默认 5e6 大约几秒就耗尽 → 脚本被判 BUDGET_EXCEEDED 退出

# ---- 调试通道(可选; DebugServer, 见 docs/planA/13/16) ----
# 板端随 kine-x.service 自启, 监听 DEBUG_PORT, 等 PC 上的 VSCodium 插件来连。
# D1~D6 已实装(含 D4 热更新 / D5 断点单步[仅 BASIC] / D6 文件管理), 按 caps 据实声明。
DEBUG_ENABLE    = 1             # 1=开机启用调试通道
DEBUG_PORT      = 5000          # 本项目自定端口(非 ZDevelop 的 500)
DEBUG_BIND      = 0.0.0.0       # 绑业务网卡; 局域网 PC 直连(也可写 192.168.1.11)
DEBUG_TOKEN     =               # 可选加固: 非空则首帧须 {"m":"auth","p":{"token":"..."}}
DEBUG_MAX_STEPS = 0             # 调试口 script.run 步数预算兜底; 0=不限(便于通过插件试跑长驻脚本)
DEBUG_SCRIPT_DIR= /userdata/kine-x/scripts  # D6 目录: 下载带 name 时源码落盘到这里, file.* 只作用该目录
                                  # 该目录同时决定调试口语言: 空=auto(两种都收) / 只有一种=绑定 / 两种并存=mixed(拒绝编译)
                                  # .boot 隐藏清单(D8/插件维护)=开机主文件; 其它脚本由主文件 INCLUDE "xxx.bas" 作为子程序调用
DEBUG_RESTART_CMD = sudo -n systemctl restart kine-x.service
                                  # D7: sys.restart 的执行命令(插件菜单 控制器→重启控制器),
                                  # 命令失败时回退「优雅退出+失败码」交 Restart=on-failure 重启;
                                  # 置空 = 关闭重启能力(caps 不报 d7, sys.restart 回 NOT_SUPPORTED)

# ---- 日志 ----
DBG             = 0
LOG_MS          = 3000          # 周期日志限频
